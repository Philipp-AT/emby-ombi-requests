name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # only used for the release on version tags
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the plugin
        run: dotnet build src/OmbiRequests -c Release -p:ContinuousIntegrationBuild=true

      - name: Run the tests
        run: dotnet run --project tests/OmbiRequests.Tests -c Release -- --quiet

      # Headless Edge occasionally hangs on CI machines; a failure here does not block the release.
      - name: Run the web app tests
        shell: pwsh
        run: ./tests/web/run-web-tests.ps1
        timeout-minutes: 5
        continue-on-error: true

      - name: Keep the DLL
        uses: actions/upload-artifact@v7
        with:
          name: OmbiRequests
          path: src/OmbiRequests/bin/Release/netstandard2.0/OmbiRequests.dll

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: src/OmbiRequests/bin/Release/netstandard2.0/OmbiRequests.dll
          generate_release_notes: true
          # Tags with a suffix like v1.0.0-beta are pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
